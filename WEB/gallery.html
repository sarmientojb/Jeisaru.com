<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Gallery</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
}

/* Header */
header {
    text-align: center;
    padding: 20px;
    font-size: 28px;
    font-weight: bold;
    background: linear-gradient(90deg, #ff4d6d, #7c3aed);
}

/* Gallery grid */
.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    padding: 20px;
}

.gallery img {
    width: 100%;
    height: 250px;
    object-fit: cover;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.3s ease;
}

.gallery img:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(255,255,255,0.3);
}

/* Modal viewer */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.modal img {
    max-width: 90%;
    max-height: 80%;
    border-radius: 10px;
}

.close {
    position: absolute;
    top: 20px;
    right: 40px;
    font-size: 40px;
    cursor: pointer;
}

/* Video section */
.video-section {
    padding: 20px;
    text-align: center;
}

video {
    width: 90%;
    max-width: 800px;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(0,0,0,0.6);
}

/* Footer */
footer {
    text-align: center;
    padding: 15px;
    background: #020617;
    margin-top: 20px;
}
</style>
</head>
<body>

<header>🔥 Anime Gallery</header>

<!-- Gallery -->
<div class="gallery">
    <img src="https://picsum.photos/400/600?random=1" onclick="openModal(this.src)">
    <img src="https://picsum.photos/400/600?random=2" onclick="openModal(this.src)">
    <img src="https://picsum.photos/400/600?random=3" onclick="openModal(this.src)">
    <img src="https://picsum.photos/400/600?random=4" onclick="openModal(this.src)">
    <img src="https://picsum.photos/400/600?random=5" onclick="openModal(this.src)">
    <img src="https://picsum.photos/400/600?random=6" onclick="openModal(this.src)">
</div>

<!-- Modal -->
<div class="modal" id="modal" onclick="closeModal()">
    <span class="close">&times;</span>
    <img id="modalImg">
</div>

<!-- Video Section -->
<div class="video-section">
    <h2>🎬 Featured Anime Video</h2>
    <video controls>
        <source src="your-anime-video.mp4" type="video/mp4">
        Your browser does not support video.
    </video>
</div>

<footer>© 2026 Anime Gallery</footer>

<script>
function openModal(src) {
    document.getElementById("modal").style.display = "flex";
    document.getElementById("modalImg").src = src;
}

function closeModal() {
    document.getElementById("modal").style.display = "none";
}
</script>

</body>
</html>
